<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 360" width="132" height="360" role="img" aria-label="Nanoindentation Modulus Map color scale from low to high">
  <defs>
    <linearGradient id="bgyr" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0000ff"/>
      <stop offset="33.33%" stop-color="#00ff00"/>
      <stop offset="66.67%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
  </defs>

  <rect width="132" height="360" fill="#ffffff"/>

  <text x="66" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222">Nanoindentation /</text>
  <text x="66" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222">Modulus Map</text>

  <rect x="44" y="48" width="16" height="276" fill="url(#bgyr)" stroke="#000000" stroke-width="1"/>

  <text x="66" y="58" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222">Low</text>
  <text x="66" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222">High</text>
